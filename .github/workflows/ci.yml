name: Verify native engine and desktop frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p harness-sync-core -p harness-sync-native --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p harness-sync-core -p harness-sync-native --all-features
      - run: cargo build --locked -p harness-sync-native --bin harness-sync-fixture-peer
      - if: runner.os != 'Windows'
        run: node scripts/native-peer-e2e.mjs
      - if: runner.os == 'Windows'
        run: node scripts/native-peer-e2e.mjs target/debug/harness-sync-fixture-peer.exe
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_repository.py
