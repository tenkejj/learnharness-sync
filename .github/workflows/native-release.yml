name: Build standalone Linux candidates (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo test --locked -p harness-sync-core -p harness-sync-native
      - run: npm run test:peers
      - run: scripts/build-linux-candidates
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-linux-candidates
          path: target/release/bundle/
